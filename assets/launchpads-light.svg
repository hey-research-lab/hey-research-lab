<text x="40" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#535B66">Every token credits the launchpad that made it, with a Launched stamp in its Token Passport. Same rules for every launchpad.</text>
