<text x="760.6666666666666" y="252" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#535B66">published pages on HEY launched here</text></g>
