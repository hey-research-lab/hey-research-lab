<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="HEY's ERC-8004 validator answers one claim, that a project shipped between two times, from its counted ships. Robinhood Chain: 1 requests read, 1 answered; Base: 0 requests read, 0 answered; Ethereum: 0 requests read, 0 answered.">
