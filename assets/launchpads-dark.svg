<text x="62" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#94A0AD">HEY reads its launch factory on chain,</text><text x="62" y="187" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#94A0AD">and every FOBO launch says &quot;Launched via</text><text x="62" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#94A0AD">FOBO&quot;.</text>
