<text x="441.3333333333333" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#94A0AD">HEY reads each launch record and the day</text><text x="441.3333333333333" y="187" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#94A0AD">a launch graduates into a Uniswap v4</text><text x="441.3333333333333" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#94A0AD">pool.</text>
