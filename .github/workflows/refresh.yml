# Refreshes the profile's live numbers once a day: the stats card and the "fixes sent upstream" table.
# Public sources only (GitHub search, heyresearch.xyz/api/status); free on a public repository.
name: Refresh profile

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh.mjs
      - name: Commit when something moved
        run: |
          if git diff --quiet; then echo "nothing moved"; exit 0; fi
          git config user.name "HEY Research Lab"
          git config user.email "327801004+hey-research-lab@users.noreply.github.com"
          git commit -am "Profile: refresh the numbers"
          git push
