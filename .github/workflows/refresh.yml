# Refreshes the profile's live parts once a day: the hero, the pictures, the stats card and the README's live lines.
# Public sources only (GitHub search and advisories, heyresearch.xyz's public API, the MCP registry); free on a public repository.
name: Refresh profile

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh.mjs
      - name: Commit when something moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "nothing moved"; exit 0; fi
          git config user.name "HEY Research Lab"
          git config user.email "327801004+hey-research-lab@users.noreply.github.com"
          git commit -am "Profile: refresh the numbers"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
